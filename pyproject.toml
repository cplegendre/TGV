[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgv-agent"
version = "0.32"
description = "Task Gateway and Validator — local first, cloud when necessary."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "TGV contributors" }]
keywords = ["ai", "coding-agent", "mcp", "ollama", "routing", "llm"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
mcp = ["mcp>=1.10,<2"]
ter = ["ter-calculator[embeddings] @ git+https://github.com/cplegendre/TER.git@v3.0.0"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "setuptools>=83",
  "types-PyYAML>=6.0.12",
  "types-tqdm",
  "pip-audit>=2.7,<3",
]

[project.scripts]
tgv = "tgv.cli:main"
tgv-mcp = "tgv.mcp_server:main"

[project.urls]
Homepage = "https://github.com/cplegendre/tgv"
Issues = "https://github.com/cplegendre/tgv/issues"
Documentation = "https://github.com/cplegendre/tgv/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tgv = ["py.typed", "data/*.jsonl", "demo_assets/**/*.json", "demo_assets/**/*.md", "demo_assets/**/*.toml", "demo_assets/**/*.py"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config --cov=tgv --cov-report=term-missing --cov-fail-under=98"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tgv"]
omit = ["src/tgv/mcp_server.py", "src/tgv/__main__.py", "src/tgv/bench/*.py"]

[tool.coverage.report]
show_missing = true
fail_under = 98

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
  "build",
  "dist",
  ".venv",
  "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tgv"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["ter_calculator", "ter_calculator.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The mcp SDK ships untyped decorators (@mcp.tool()), a limitation of the
# third-party library, not our code. Scoped to this one module only.
module = ["tgv.mcp_server"]
disallow_untyped_decorators = false
ignore_missing_imports = true
