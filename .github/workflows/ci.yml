name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,mcp]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src/tgv
      - run: python -m pytest
      - run: python scripts/check_version.py
      - run: python scripts/check_packaging_cleanliness.py
      - run: tgv bench routing --json
      - run: tgv bench index --repo . --query "RouteDecision Repository" --json
      - run: tgv benchmark run --enforce --json
      - run: python -m build
      - run: pip-audit
      - run: bash scripts/smoke_test.sh
